<!DOCTYPE html>
<html>
<head>
  <title>Tiny Tetris</title>
  <style>
    canvas {
      background: black;
      display: block;
      margin: auto;
    }
  </style>
</head>
<body>

<canvas id="game" width="200" height="400"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const grid = 20;
let piece = { x: 4, y: 0 };

function drawBlock(x, y) {
  ctx.fillStyle = "cyan";
  ctx.fillRect(x * grid, y * grid, grid - 1, grid - 1);
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawBlock(piece.x, piece.y);
}

function update() {
  piece.y += 1;
  if (piece.y > 19) piece.y = 0; // loop
}

document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") piece.x--;
  if (e.key === "ArrowRight") piece.x++;
});

function gameLoop() {
  update();
  draw();
}

setInterval(gameLoop, 500);
</script>

</body>
</html>
